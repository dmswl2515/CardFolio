name: Deploy To EC2

on:
  push:
    branches:
        - main

jobs:
    Deploy:
        if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              with:
                token: ${{ secrets.ACCESS_TOKEN }} 

            - name: SSH(원격접속)으로 EC2에 접속하기
              uses: appleboy/ssh-action@v1.2.0
              env:
                APPLICATION_PROPERTIES: ${{ secrets.APPLICATION_PROPERTIES }}
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_PRIVATE_KEY }}
                timeout: 600s
                command_timeout: 600s
                script_stop: false
                script: |
                    echo "Step 1: Basic test"
                    pwd
                    echo "Step 2: User check"
                    whoami
                    echo "Step 3: Date check"
                    date
                    echo "All steps completed"
                    
                    echo "=== Git Operations Test ==="
                    cd /home/ec2-user/CardFolio
                    
                    git status
                    echo "Git status checked"
                    
                    git pull origin main
                    echo "Git pull completed"

                    ./gradlew clean build --no-daemon --max-workers=1 -x test

                    #/home/ec2-user/apache-tomcat-10.1.39/bin/shutdown.sh || true
                    #sleep 5

                    
